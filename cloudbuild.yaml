steps:
  # 1. Build React client bundle into server/public
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd client && npm install && npm run build'

  # 2. Build the image using Google Cloud Buildpacks (targeting server directory)
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - '$_DEPLOY_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME'
      - '--path'
      - 'server'
      - '--builder'
      - 'gcr.io/buildpacks/builder:v1'
      - '--publish'
    env:
      - 'DOCKER_API_VERSION=1.41'
      - 'GOOGLE_NODEJS_VERSION=20.x'

  # 2. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_DEPLOY_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_REPOSITORY: 'diamora'
  _SERVICE_NAME: 'diamora-web'
  _DEPLOY_REGION: 'asia-southeast1'
